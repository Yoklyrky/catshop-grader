# The QA stage: pull what was published, stand it up, drive it, take it down.
# Every move is a step, because a stage nobody can read is a stage nobody debugs.
on:
  workflow_call:
    inputs:
      image:
        description: the digest to test
        required: true
        type: string
jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ["", partner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r lab-03/requirements-dev.txt

      - name: pull the digest
        run: docker pull "${{ inputs.image }}"

      - name: up
        env:
          QA_IMAGE: ${{ inputs.image }}
        run: |
          docker compose -f lab-03/qa/compose.qa.yaml \
            ${{ matrix.profile && format('--profile {0}', matrix.profile) || '' }} \
            up -d --wait --wait-timeout 120

      - name: drive it
        env:
          QA_BASE_URL: http://localhost:8080
          QA_PROFILE: ${{ matrix.profile }}
        run: python -m pytest lab-03/qa -q --junitxml=lab-03/qa-report.xml

      - name: down
        if: always()
        env:
          QA_IMAGE: ${{ inputs.image }}
        run: docker compose -f lab-03/qa/compose.qa.yaml down -v

      - if: always()
        run: echo "qa ${{ matrix.profile || 'no-partner' }} done" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-${{ matrix.profile || 'no-partner' }}
          path: lab-03/qa-report.xml
