name: lab-03
on: push
concurrency:
  group: ci
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip
      - run: pytest lab-03/tests
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: pytest lab-03/tests
      - run: docker build -t ghcr.io/x/y:latest .
      - run: docker push ghcr.io/x/y:latest
