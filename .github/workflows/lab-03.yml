# Reusable workflow — grade all of lab 3 in one call.
#
#   jobs:
#     lab-03:
#       uses: kse-ci-cd-basics-course/catshop-grader/.github/workflows/lab-03.yml@v1
#       with:
#         required: "reuse,cache"
#         bonus: "qa,aqa,concurrency"
#
# One job per section, via the matrix. One of these per lab: `uses:` cannot take
# an expression, so a lab-agnostic workflow could not pick its action path.
name: lab-03

on:
  workflow_call:
    inputs:
      path:
        description: "The lab folder to grade"
        required: false
        type: string
        default: "lab-03"
      required:
        description: "Comma-separated sections that must pass"
        required: false
        type: string
        default: "reuse,cache"
      bonus:
        description: "Comma-separated sections that may fail without failing the lab"
        required: false
        type: string
        default: "qa,aqa,concurrency"
      port:
        description: "Host port the published image is run on"
        required: false
        type: string
        default: "8080"

# actions: read is what lets three checks ask what really happened — a reusable
# call that ran, the cache entries, and a cancelled run. packages: read is the pull.
permissions:
  contents: read
  actions: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.split.outputs.required }}
      bonus: ${{ steps.split.outputs.bonus }}
      has_bonus: ${{ steps.split.outputs.has_bonus }}
    steps:
      - id: split
        shell: bash
        env:
          REQUIRED: ${{ inputs.required }}
          BONUS: ${{ inputs.bonus }}
        run: |
          # comma-separated input -> the JSON array a matrix consumes
          to_json() {
            printf '%s' "$1" | tr ',' '\n' \
              | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))'
          }
          req="$(to_json "$REQUIRED")"
          bon="$(to_json "$BONUS")"
          echo "required=$req" >> "$GITHUB_OUTPUT"
          echo "bonus=$bon"    >> "$GITHUB_OUTPUT"
          if [ "$bon" = '[]' ]; then echo "has_bonus=false" >> "$GITHUB_OUTPUT"
          else                       echo "has_bonus=true"  >> "$GITHUB_OUTPUT"; fi

  required:
    needs: plan
    name: "section · ${{ matrix.section }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        section: ${{ fromJSON(needs.plan.outputs.required) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: kse-ci-cd-basics-course/catshop-grader/lab-03@v1
        with:
          section: ${{ matrix.section }}
          path: ${{ inputs.path }}
          port: ${{ inputs.port }}

  bonus:
    needs: plan
    if: needs.plan.outputs.has_bonus == 'true'
    name: "section · ${{ matrix.section }} (bonus)"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        section: ${{ fromJSON(needs.plan.outputs.bonus) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: kse-ci-cd-basics-course/catshop-grader/lab-03@v1
        with:
          section: ${{ matrix.section }}
          path: ${{ inputs.path }}
          port: ${{ inputs.port }}
